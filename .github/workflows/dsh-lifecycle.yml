# Generated by DSH Testkit 0.4.0. Review before committing.
name: DSH lifecycle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-external:
    name: DSH lifecycle (external PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dsh-test:pack
      - name: Run lifecycle
        run: pnpm --package=dsh-testkit@0.4.0 dlx dsh-test .dsh-testkit-plugin.tgz --config dsh-testkit.yaml
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-lifecycle-${{ github.run_id }}
          path: .dsh-testkit/runs
          if-no-files-found: error
          retention-days: 14

  lifecycle-trusted:
    name: DSH lifecycle (trusted branch)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dsh-test:pack
      - uses: iiwish/dsh-testkit/.github/actions/dsh-test@c25df9077825ab2cd7fe4ba2cb61023bfce70033 # v0.4.0
        with:
          plugin: .dsh-testkit-plugin.tgz
          dsh-version: '0.1.1-rc.2'
          config: dsh-testkit.yaml
          check-name: DSH lifecycle
